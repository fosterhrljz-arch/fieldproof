<style>
:root {
  color-scheme: light;
  --nav: #101e34;
  --nav-bottom: #0e192c;
  --nav-ink: #cbd7e8;
  --page: #f2f6fb;
  --paper: #fff;
  --ink: #112039;
  --muted: #5b6d84;
  --line: #dce5f0;

  --blue: #1961ce;
  --blue-dark: #124fae;
  --red: #a12d38;
  --sidebar: 231px;
  --r: 11px;

  font-size: 14px;
  color: var(--ink);
  background: var(--page);
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button,input,select,textarea { font: inherit; color: inherit; }
button,select,a[href],input[type=file] { cursor: pointer; }
button { border: 0; }
a { color: var(--blue-dark); text-decoration: none; }
.link { font-weight: 650; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 3px solid #54a7ff; outline-offset: 3px; }
:disabled { cursor: wait; opacity: .6; }
[hidden] { display: none !important; }
h1,h2,h3,p,figure { margin: 0; }
h1 { font-size: clamp(29px,3vw,41px); line-height: 1.13; letter-spacing: -.046em; font-weight: 750; }
h2 { font-size: 20px; line-height: 1.28; letter-spacing: -.025em; font-weight: 720; }
h3 { font-size: 14px; font-weight: 690; }
p { line-height: 1.52; }
small { font-size: 12px; }
.skip { position: absolute; left: 12px; top: -100px; z-index: 30; padding: 10px 16px; background: white; }
.skip:focus { top: 12px; }
.sidebar { position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; width: var(--sidebar); padding: 0 13px 16px; background: linear-gradient(165deg,var(--nav),var(--nav-bottom)); color: white; z-index: 11; }
.brand { display: flex; align-items: center; gap: 10px; padding: 19px 10px 23px; color: white; font-size: 25px; font-weight: 740; letter-spacing: -.045em; }
.brand span { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 9px; background: #143751; color: #46d4f4; }
.nav-label { color: #91a6c3; padding: 13px 12px 10px; font-size: 10px; font-weight: 750; letter-spacing: .135em; }
.sidebar nav a { display: flex; align-items: center; min-height: 46px; padding: 0 11px; gap: 12px; color: var(--nav-ink); border-radius: 8px; margin-bottom: 3px; font-weight: 590; }
.sidebar nav a:hover { background: #1a304c; color: white; }
.sidebar nav a.active { color: white; background: #1a4e88; box-shadow: inset 3px 0 #4db8ff; }
.sidebar nav a b { margin-left: auto; border-radius: 6px; background: #f58a4a; color: #301605; min-width: 22px; text-align: center; padding: 2px 4px; font-size: 11px; }
.local { display: flex; align-items: center; gap: 10px; margin-top: auto; border: 1px solid #354962; border-radius: 10px; padding: 11px 9px; background: #18283e; }
.local-icon { display: grid; place-items: center; width: 31px; height: 32px; flex: 0 0 auto; color: #d0e3f9; background: #223650; border-radius: 7px; }

.local span { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: #c0cede; white-space: nowrap; }
.local i { width: 6px; height: 6px; border-radius: 50%; background: #47d8a9; }
.workspace { margin-left: var(--sidebar); min-width: 0; }
.topbar { height: 63px; border-bottom: 1px solid var(--line); background: white; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 0 31px; }
.crumb { color: var(--muted); display: flex; align-items: center; gap: 11px; min-width: 0; font-weight: 540; }
.crumb-brand { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb strong { color: var(--ink); white-space: nowrap; }
.crumb-divider { color: #93a4ba; }
.profile { display: flex; align-items: center; gap: 9px; padding: 4px 3px; background: white; color: var(--muted); border-radius: 8px; }
.profile:hover { color: var(--blue); background: #f3f7fe; }
.profile-name { text-align: left; color: var(--ink); white-space: nowrap; font-size: 13px; font-weight: 690; }
.profile-name small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }
.avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #dff0ff; color: #164b9a; font-weight: 750; font-size: 12px; }
#main { max-width: 1650px; margin: auto; padding: 28px 31px 40px; outline: none; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 27px; }
.page-head p { margin-top: 7px; color: var(--muted); font-size: 14px; }
.actions,.row-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.actions { justify-content: flex-end; }
.btn { min-height: 37px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #cfdbea; border-radius: 7px; padding: 7px 12px; background: white; font-weight: 650; line-height: 1.22; font-size: 13px; white-space: nowrap; color: var(--ink); }
.btn:hover { background: #edf4fc; border-color: #a8c3e5; }
.btn.primary { color: white; background: var(--blue); border-color: var(--blue); box-shadow: 0 1px 2px #153c7340; }
.btn.primary:hover { background: var(--blue-dark); border-color: var(--blue-dark); }
.btn.danger { color: white; background: #a73542; border-color: #a73542; }
.btn.danger:hover { background: #872a35; }
.btn.subtle { color: var(--blue-dark); background: transparent; border-color: transparent; }
.btn.subtle:hover { background: #edf4fc; }
.btn.icon-only { font-size: 0; width: 36px; padding: 0; min-height: 36px; }
.mobile-menu,.nav-shade { display: none !important; }
.filter { display: inline-flex; align-items: center; min-height: 37px; gap: 7px; color: #48617f; border: 1px solid #cfdbea; border-radius: 7px; background: white; padding: 0 9px; font-size: 13px; white-space: nowrap; position: relative; }
.filter select,.filter input { background: transparent; border: none; border-radius: 0; width: 100%; color: var(--ink); min-height: 35px; outline: none; }
.filter select { appearance: none; width: calc(100% + 16px); padding: 0 21px 0 0; margin-right: -19px; font-weight: 620; }
.filter:focus-within { outline: 2px solid #54a7ff; outline-offset: 2px; }
.filter svg { flex: 0 0 auto; pointer-events: none; }
.filter.search { min-width: 205px; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.section-head p { color: var(--muted); font-size: 12px; margin-top: 2px; }
.surface { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; box-shadow: 0 1px 2px #233c6610; }
.metrics { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 14px; }
.metric { display: flex; align-items: flex-start; gap: 12px; padding: 15px; min-height: 115px; }
.metric-icon { display: grid; place-items: center; width: 41px; height: 41px; flex: 0 0 auto; border-radius: 9px; }
.metric-icon.green { background: #dff5e9; color: #157449; }
.metric-icon.teal { background: #dcf4ef; color: #137e6f; }
.metric-icon.blue { background: #e3efff; color: #1c62be; }
.metric-icon.red { background: #fee9e8; color: #bd3b42; }
.metric strong { font-size: 31px; line-height: 1; letter-spacing: -.045em; font-weight: 750; display: block; margin-bottom: 4px; }
.metric p { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.3; }
.charts { display: grid; grid-template-columns: minmax(0,1.65fr) minmax(0,1fr); gap: 16px; margin: 17px 0; }
.pane-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 17px; }
.pane-head p { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.pane-head > :last-child { flex-shrink: 0; }
.pane-head > div:first-child { min-width: 0; flex-shrink: 1; overflow-wrap: anywhere; }
.bar-chart { display: grid; grid-template-columns: 25px 1fr; margin: 6px 20px 0 14px; height: 173px; position: relative; }
.axis-labels { display: flex; flex-direction: column; justify-content: space-between; height: 153px; text-align: right; padding-right: 8px; font-size: 10.5px; color: var(--muted); position: relative; top: -5px; }
.plot { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); height: 147px; position: relative; }
.grid-lines { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
.grid-lines i { border-top: 1px solid #e0e8f1; }
.grid-lines i:last-child { border-color: #c9d8e8; }
.bar-group { position: relative; height: 147px; min-width: 0; }
.bars { display: flex; justify-content: center; align-items: end; height: 100%; gap: clamp(2px,.35vw,6px); padding: 0 5px; }
.bar { display: block; width: min(26px,46%); border-radius: 4px 4px 0 0; }
.bar.opened { background: #2465bf; }
.bar.closed { background: #9cd6f2; }
.bar:hover { filter: brightness(.88); }
.bar-group small { text-align: center; display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; margin-top: 6px; }
.legend { display: flex; gap: 18px; font-size: 11.5px; color: #385170; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; background: var(--swatch); }
.legend b { margin-left: auto; color: var(--ink); }
.bar-legend { justify-content: center; padding: 0 12px 14px; }
.donut-wrap { display: grid; place-items: center; padding: 0 0 12px; }
.donut { width: 147px; height: 147px; display: grid; place-items: center; border-radius: 50%; background: var(--donut); }
.donut > div { border-radius: 50%; width: 110px; height: 110px; color: var(--ink); background: white; display: grid; place-content: center; text-align: center; }
.donut strong { font-size: 34px; line-height: 1.02; letter-spacing: -.05em; }
.donut span { color: var(--muted); letter-spacing: .08em; font-size: 8.5px; font-weight: 690; margin-top: 5px; }
.status-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 17px; padding: 0 18px 14px; }
.table-scroll { overflow-x: auto; width: 100%; border-radius: 0 0 var(--r) var(--r); }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
thead { background: #edf3fa; color: #4c6380; border-block: 1px solid #e2eaf4; }
th { font-weight: 740; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; white-space: nowrap; }
th,td { padding: 9px 16px; vertical-align: middle; }
td { border-bottom: 1px solid var(--light-line); }
tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: #f6faff; }
td:first-child { min-width: 175px; }
td small { display: block; margin-top: 3px; font-size: 11px; line-height: 1.37; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px; white-space: nowrap; background: #edf1f6; color: #465a72; font-size: 11px; font-weight: 710; }
.tag-open,.tag-scheduled { background: #e5effe; color: #194f9d; }
.tag-pending-verification,.tag-active,.tag-pass,.tag-in-service { background: #dff4ee; color: #135e51; }
.tag-closed,.tag-completed,.tag-low { background: #e7f4ec; color: #236641; }
.tag-in-progress,.tag-draft,.tag-medium,.tag-paused { background: #fff1d7; color: #795018; }
.tag-urgent,.tag-high,.tag-fail,.tag-out-of-service,.tag-blocked { background: #fae7e9; color: #8f2638; }
.tag-urgent { background: #f8d9de; color: #831827; }
.late,td small.late { color: var(--red); }
.empty { text-align: center; padding: 32px 18px; display: grid; justify-items: center; gap: 7px; color: var(--muted); }
.empty > span { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 11px; background: #eaf2fb; color: #3e6fb1; }
.empty strong { color: var(--ink); font-size: 15px; }
.empty p { max-width: 40ch; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin: 0 0 14px; }
.surface > .toolbar { padding: 0 16px; }
.tabs { display: flex; gap: 17px; border-bottom: 1px solid #ccd9e9; margin: -5px 0 16px; }
.tabs a { display: inline-flex; padding: 10px 10px 12px; color: var(--muted); font-weight: 650; border-bottom: 3px solid transparent; }
.tabs a.selected,.tabs a:hover { color: var(--blue-dark); border-color: var(--blue); }
.back-link { display: inline-flex; align-items: center; gap: 5px; margin-bottom: 7px; font-size: 12px; font-weight: 650; }
.detail-wrap { max-width: 855px; margin: 0 auto; }
.inspection-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 15px; }
.equipment { display: flex; align-items: center; gap: 11px; }
.equipment p { margin-top: 2px; font-size: 12px; color: var(--muted); }
.progress-head { display: flex; justify-content: space-between; color: var(--muted); margin: 16px 0 6px; font-size: 12px; }
.progress-head strong { color: var(--ink); }
progress { height: 7px; display: block; width: 100%; appearance: none; border: none; border-radius: 20px; overflow: hidden; color: var(--blue); background: #dfe9f5; }
progress::-webkit-progress-bar { background: #dfe9f5; }
progress::-webkit-progress-value { background: var(--blue); border-radius: 20px; }
progress::-moz-progress-bar { background: var(--blue); }
.check-list { display: grid; gap: 12px; margin: 13px 0 18px; }
.check-card { padding: 16px; }
.check-title { display: flex; gap: 10px; align-items: flex-start; }
.check-title > span { color: #356297; background: #e9f1fb; border-radius: 6px; min-width: 25px; height: 25px; display: grid; place-items: center; font-size: 11px; font-weight: 750; }
.check-title h2 { font-size: 17px; }
.check-title p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 13px 0 11px; }
.choice { min-height: 41px; }
.choice.pass { color: #156449; }
.choice.fail { color: #a42d40; }
.choice.pass[aria-pressed=true] { background: #ddf5e8; border-color: #7dc5a2; box-shadow: inset 0 0 0 1px #7dc5a2; }
.choice.fail[aria-pressed=true] { background: #fce7e9; border-color: #ed909d; box-shadow: inset 0 0 0 1px #ed909d; }
.evidence-tools,.linked-record { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 10px; color: var(--muted); }
.linked-record { border-top: 1px solid var(--line); padding-top: 10px; }
.photo-input { cursor: pointer; position: relative; color: var(--blue-dark); }
.photo-input input { position: absolute; width: 100%; height: 100%; inset: 0; opacity: 0; }
.photo-input:focus-within { outline: 3px solid #54a7ff; outline-offset: 2px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill,minmax(124px,1fr)); gap: 9px; max-width: 590px; margin-top: 10px; }
.photos figure { position: relative; min-width: 0; }
.photos figure > button:first-child { width: 100%; padding: 0; background: #e4edf9; overflow: hidden; display: block; aspect-ratio: 3/2; border-radius: 7px; border: 1px solid var(--line); }
.photos img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photos figcaption { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 3px; }
.photos .remove-photo { position: absolute; right: 4px; top: 4px; width: 27px; min-height: 27px; }
.large-photo { width: 100%; max-height: 65vh; object-fit: contain; border-radius: 7px; }
.inspection-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; bottom: 0; padding: 11px 12px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 -3px 18px #19386211; z-index: 2; }
.inspection-footer span,.hint { font-size: 12px; color: var(--muted); }
.inline-info { padding: 10px 12px; margin-top: 10px; background: #eaf2ff; color: #234875; border-radius: 7px; font-size: 13px; }
.record-result { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--muted); font-size: 12px; margin: 10px 0; }
.work-split,.site-split { display: grid; grid-template-columns: minmax(230px, .6fr) minmax(0,1.7fr); gap: 16px; align-items: start; }
.work-detail { display: grid; gap: 13px; min-width: 0; }
.evidence-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); align-items: start; gap: 13px; }
.queue-item { display: flex; align-items: center; justify-content: space-between; gap: 5px; color: var(--ink); padding: 10px 14px; border-top: 1px solid var(--light-line); }
.queue-item strong { font-size: 13px; }
.queue-item div > span:not(.tag) { display: block; color: var(--muted); font-size: 11px; margin: 3px 0 4px; }
.queue-item.chosen,.queue-item:hover { background: #eef5ff; color: #194d96; }
.queue-item.chosen { box-shadow: inset 3px 0 #2c76da; }
.section-body { padding: 0 17px 16px; }
.facts { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 11px 22px; border-block: 1px solid var(--light-line); padding: 11px 0; margin-bottom: 10px; }
.facts > div > small,.facts > div > span:not(.tag) { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
.facts strong { font-size: 13px; }
.facts > div > span:not(.tag) { margin: 3px 0 0; }
.body-copy { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 7px; }
.detail-actions { justify-content: flex-start; margin-top: 11px; }
.repair + .repair { border-top: 1px solid var(--line); padding-top: 12px; }
.repair small { display: block; margin: 4px 0 6px; color: var(--muted); }
.timeline { margin: 0 17px 18px 22px; padding: 0; list-style: none; }
.timeline li { padding: 0 0 14px 15px; border-left: 1px solid #cfdfef; position: relative; }
.timeline li::before { content: ""; position: absolute; top: 5px; left: -4px; width: 7px; height: 7px; background: #407fcb; border-radius: 50%; }
.timeline li:last-child { padding-bottom: 0; }
.timeline small { display: block; margin-top: 2px; color: var(--muted); }
.timeline p { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; }
.site-tree nav { padding: 0 9px 10px; }
.site-tree nav a { display: flex; gap: 7px; align-items: center; color: var(--ink); padding: 7px 6px; border-radius: 6px; font-size: 13px; }
.site-tree nav a svg { color: #52719a; flex-shrink: 0; }
.site-tree nav a.selected,.site-tree nav a:hover { background: #eaf2fb; color: #194f9d; }
.tree-node > div { padding-left: 12px; }
.stack { margin-top: 13px; }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; align-items: start; }
.settings-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.form-grid .wide { grid-column: 1/-1; }
.field { display: flex; flex-direction: column; gap: 5px; font-weight: 650; font-size: 13px; }
.field input,.field select,.field textarea { width: 100%; min-height: 38px; border: 1px solid #cedbeb; border-radius: 7px; padding: 8px 10px; background: #fff; font-weight: 450; }
.field textarea { resize: vertical; }
.field input[readonly] { background: #f1f5fa; }
.checkbox { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.question-editor { min-width: 0; display: grid; gap: 9px; border: 1px solid var(--line); border-radius: 9px; padding: 10px; margin: 0 0 7px; }
.question-editor legend { font-weight: 700; color: var(--blue-dark); }
.question-editor .row-actions { justify-content: space-between; align-items: flex-end; }
dialog { width: min(540px,calc(100% - 24px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid #d2deec; border-radius: 13px; box-shadow: 0 18px 65px #0b193e3d; color: var(--ink); }
dialog::backdrop { background: #0e20356b; }
.dialog-head { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 14px 17px; border-bottom: 1px solid var(--line); }
.dialog-form,.dialog-body { padding: 15px 17px; }
.dialog-body .field { margin-top: 10px; }

<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app"><main class="loading"><span>FieldProof</span><p>Opening the local workspace…</p></main></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <noscript>FieldProof requires JavaScript. Enable it to open your local workspace.</noscript>
  <script>
(() => {
  const DAY = 86400000;
  const statuses = ['Open', 'In Progress', 'Pending Verification', 'Closed'];
  const priorities = ['Urgent', 'High', 'Medium', 'Low'];
  const assetStates = ['In service', 'Out of service', 'Retired'];
  const roles = ['Inspector', 'Maintenance', 'Supervisor'];
  const kinds = ['Site', 'Building', 'Area'];
  const intervals = ['Weekly', 'Every two weeks', 'Monthly', 'Quarterly'];
  const find = (list, id) => list.find(item => item.id === id);
  const check = (condition, message) => { if (!condition) throw new Error(message); };
  const required = (value, label) => {
    const clean = String(value ?? '').trim();
    check(clean.length > 0, label + ' is required.');
    return clean;
  };
  const uid = () => globalThis.crypto?.randomUUID?.() ??
    Array.from(globalThis.crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, '0')).join('');
  const localDay = (date = new Date()) => [date.getFullYear(), date.getMonth() + 1, date.getDate()]
    .map((part, index) => String(part).padStart(index ? 2 : 4, '0')).join('-');
  const asDate = day => new Date(day + 'T12:00:00');
  const shift = (day, amount) => {
    const date = asDate(day);
    date.setDate(date.getDate() + amount);
    return localDay(date);
  };
  const validDate = day => /^\d{4}-\d{2}-\d{2}$/.test(day) &&
    Number.isFinite(+asDate(day)) && localDay(asDate(day)) === day;
  const dateValue = (day, label = 'Due date') => {
    check(validDate(day), 'Choose a valid ' + label.toLowerCase() + '.');
    return day;
  };
  const timestampDay = iso => iso ? localDay(new Date(iso)) : '';
  const chain = (state, areaId) => {
    const area = find(state.places, areaId);
    const building = find(state.places, area?.parentId);
    const site = find(state.places, building?.parentId);
    return [site, building, area].filter(Boolean);
  };
  const location = (state, asset) => chain(state, asset?.areaId).map(place => place.name).join(' / ');
  const assetSite = (state, assetId) => chain(state, find(state.assets, assetId)?.areaId)[0]?.id;
  const sequence = (state, kind) => {
    state.sequence[kind] += 1;
    return (kind === 'inspection' ? 'IN-' : 'WO-') + String(state.sequence[kind]).padStart(4, '0');
  };
  const event = (at, actorId, title, note = '', status = '') => ({at, actorId, title, note, status});
  const statusAt = (work, day) => work.history.filter(entry => timestampDay(entry.at) <= day && entry.status).at(-1)?.status;
  const open = work => work.status !== 'Closed';
  const isOverdue = (work, today = localDay()) => open(work) && work.due < today;
  const history = (work, at, actor, title, note, status = '') => {
    work.history.push(event(at, actor.id, title, note, status));
    if (status) work.status = status;
  };
  const makeInspection = (state, fields, at, scheduleId = '') => {
    const template = find(state.templates, fields.templateId);
    const asset = find(state.assets, fields.assetId);
    check(template && !template.archived, 'Select an active inspection template.');
    check(asset && asset.status !== 'Retired', 'Select an active asset.');
    check(find(state.people, fields.assigneeId), 'Select an inspector.');
    const record = {
      id: sequence(state, 'inspection'), templateId: template.id, title: template.name, assetId: asset.id,
      assigneeId: fields.assigneeId, due: dateValue(fields.due), scheduleId, status: 'Scheduled',
      createdAt: at, updatedAt: at, startedAt: '', submittedAt: '', submittedBy: '',
      questions: template.questions.map(question => ({...question})),
      results: Object.fromEntries(template.questions.map(q => [q.id, {value: '', notes: '', photos: [], at: '', recordedBy: ''}]))
    };
    state.inspections.push(record);
    return record;
  };
  const addWork = (state, fields, at, actor, source = {}) => {
    check(find(state.assets, fields.assetId), 'Select an asset.');
    check(!fields.assigneeId || find(state.people, fields.assigneeId), 'Select a valid assignee.');
    check(priorities.includes(fields.priority), 'Select a priority.');
    const record = {
      id: sequence(state, 'work'), title: required(fields.title, 'Title'), assetId: fields.assetId,
      description: String(fields.description ?? '').trim(), due: dateValue(fields.due),
      assigneeId: fields.assigneeId || '', priority: fields.priority, status: 'Open',
      inspectionId: source.inspectionId || '', questionId: source.questionId || '',
      createdAt: at, closedAt: '', draft: {notes: '', photos: []}, repairs: [],
      history: [{...event(at, actor.id, source.inspectionId ? 'Created from failed inspection check' : 'Work order created', '', 'Open'),due: fields.due}]
    };
    state.work.push(record);
    return record;
  };
  const occurrence = (start, interval, index) => {
    if (interval === 'Weekly' || interval === 'Every two weeks') return shift(start, index * (interval === 'Weekly' ? 7 : 14));
    const first = asDate(start);
    const target = new Date(first.getFullYear(), first.getMonth() + index * (interval === 'Monthly' ? 1 : 3), 1, 12);
    const last = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
    target.setDate(Math.min(first.getDate(), last));
    return localDay(target);
  };
  const materialize = (state, at) => {
    const through = shift(timestampDay(at), 14);
    let count = 0;
    for (const schedule of state.schedules.filter(item => !item.paused)) {
      const template = find(state.templates, schedule.templateId);
      const asset = find(state.assets, schedule.assetId);
      if (template.archived || asset.status === 'Retired') continue;
      let next = occurrence(schedule.start, schedule.interval, schedule.index);
      const existing = new Set(state.inspections.filter(record => record.scheduleId === schedule.id).map(record => record.due));
      while ((next <= through || schedule.index === 0) && validDate(next)) {
        if (!existing.has(next)) {
          makeInspection(state, {...schedule, due: next}, at, schedule.id);
          count++;
        }
        schedule.index++;
        next = occurrence(schedule.start, schedule.interval, schedule.index);
      }
    }
    return count;
  };
  const empty = () => ({
    version: 1, revision: 0, workspace: 'FieldProof Workspace', activeId: 'morgan',
    settings: {defaultAssignee: '', correctiveDays: 3}, sequence: {inspection: 1000, work: 2000},
    people: [{id: 'morgan', name: 'Morgan Reed', role: 'Supervisor'}],
    places: [], assets: [], templates: [], inspections: [], schedules: [], work: [], evidence: []
  });
  function perform(state, action, at = new Date().toISOString()) {
    const actor = find(state.people, action.actorId || state.activeId);
    check(actor, 'Select a local profile first.');
    const value = action.fields || {};
    const inspection = find(state.inspections, action.id);
    const work = find(state.work, action.id);
    const supervisor = () => check(actor.role === 'Supervisor', 'Switch to a supervisor profile to verify repairs.');
    const updateDraft = (target, patch) => {
      if (typeof patch.notes === 'string') target.notes = patch.notes.slice(0, 4000);
      if (patch.photo) {
        check(target.photos.length < 12, 'Up to 12 photos can be attached here.');
        const {src, ...meta} = patch.photo;
        state.evidence.push(meta);
        target.photos.push(meta.id);
      }
      if (patch.removePhoto && target.photos.includes(patch.removePhoto)) {
        target.photos = target.photos.filter(id => id !== patch.removePhoto);
        state.evidence = state.evidence.filter(photo => photo.id !== patch.removePhoto);
      }
    };
    switch (action.type) {
      case 'tick': return materialize(state, at);
      case 'profile':
        check(find(state.people, action.id), 'Profile not found.');
        return (state.activeId = action.id);
      case 'person': {
        check(roles.includes(value.role), 'Select a role.');
        const current = find(state.people, action.id);
        if (current?.role === 'Supervisor' && value.role !== 'Supervisor') {
          check(state.people.some(person => person.id !== current.id && person.role === 'Supervisor'), 'Keep at least one supervisor profile.');
        }
        const record = {id: current?.id || uid(), name: required(value.name, 'Name'), role: value.role};
        current ? Object.assign(current, record) : state.people.push(record);
        return record.id;
      }
      case 'settings':
        check(!value.defaultAssignee || find(state.people, value.defaultAssignee), 'Select a valid assignee.');
        check(Number.isInteger(+value.correctiveDays) && +value.correctiveDays >= 0 && +value.correctiveDays <= 365, 'Enter a lead time from 0 to 365 days.');
        state.workspace = required(value.workspace, 'Workspace name');
        state.settings = {defaultAssignee: value.defaultAssignee || '', correctiveDays: +value.correctiveDays};
        return;
      case 'place': {
        const current = find(state.places, action.id);
        const kind = current?.kind || value.kind;
        const parent = current ? find(state.places, current.parentId) : find(state.places, value.parentId);
        check(kinds.includes(kind), 'Select a location type.');
        check(kind === 'Site' || parent?.kind === kinds[kinds.indexOf(kind) - 1], 'Select a valid parent location.');
        const record = {id: current?.id || uid(), kind, parentId: parent?.id || '', name: required(value.name, 'Name'), notes: value.notes.trim()};
        current ? Object.assign(current, record) : state.places.push(record);
        return record.id;
      }
      case 'asset': {
        const current = find(state.assets, action.id);
        check(find(state.places, value.areaId)?.kind === 'Area', 'Select an inspection area.');
        check(assetStates.includes(value.status), 'Select an equipment status.');
        const tag = required(value.tag, 'Asset tag');
        check(!state.assets.some(item => item.id !== current?.id && item.tag.toLowerCase() === tag.toLowerCase()), 'That asset tag is already in use.');
        const record = {
          id: current?.id || uid(), name: required(value.name, 'Asset name'), tag,
          areaId: value.areaId, type: required(value.type, 'Equipment type'), status: value.status,
          manufacturer: value.manufacturer.trim(), model: value.model.trim(), serial: value.serial.trim(),
          notes: value.notes.trim(), updatedAt: at, changes: current?.changes || []
        };
        const changes = ['name','tag','type','status','manufacturer','model','serial','notes','areaId']
          .filter(key => current && current[key] !== record[key])
          .map(key => key === 'areaId' ? 'Location' : key === 'type' ? 'Equipment type' : key.charAt(0).toUpperCase() + key.slice(1));
        if (!current || changes.length) record.changes.push(event(at, actor.id, current ? 'Asset updated' : 'Asset registered', changes.join(', ')));
        current ? Object.assign(current, record) : state.assets.push(record);
        return record.id;
      }
      case 'template': {
        const current = find(state.templates, action.id);
        check(value.questions.length && value.questions.length <= 40, 'Add 1 to 40 checklist questions.');
        const questions = value.questions.map(q => ({
          id: q.id || uid(), label: required(q.label, 'Question'), criteria: required(q.criteria, 'Pass criteria'),
          priority: q.priority
        }));
        check(questions.every(q => priorities.includes(q.priority)), 'Choose a priority for every question.');
        const record = {id: current?.id || uid(), name: required(value.name, 'Template name'), description: value.description.trim(), questions, archived: Boolean(value.archived)};
        current ? Object.assign(current, record) : state.templates.push(record);
        return record.id;
      }
      case 'inspection': return makeInspection(state, value, at).id;
      case 'reschedule':
        check(inspection && inspection.status !== 'Completed', 'This inspection has already been completed.');
        check(!inspection.scheduleId, 'Recurring occurrences keep their original due date. Change the recurring schedule for new dates.');
        check(find(state.people, value.assigneeId), 'Select an inspector.');
        Object.assign(inspection, {due: dateValue(value.due), assigneeId: value.assigneeId, updatedAt: at});
        return inspection.id;
      case 'recurrence': {
        check(intervals.includes(value.interval), 'Select a recurrence interval.');
        check(find(state.templates, value.templateId) && find(state.assets, value.assetId) && find(state.people, value.assigneeId), 'Select a template, asset, and inspector.');
        const current = find(state.schedules, action.id);
        const start = dateValue(value.start, 'Start date');
        check(current || start >= timestampDay(at), 'Choose today or a future start date.');
        const samePattern = current?.start === start && current.interval === value.interval;
        check(!current || samePattern || start >= timestampDay(at), 'Choose today or a future date for the new pattern.');
        const record = {id: current?.id || uid(), ...value, start, index: samePattern ? current.index : 0};
        current ? Object.assign(current, record) : state.schedules.push(record);
        materialize(state, at);
        return record.id;
      }
      case 'pause': {
        const schedule = find(state.schedules, action.id);
        check(schedule, 'Schedule not found.');
        if (schedule.paused) {
          while (occurrence(schedule.start, schedule.interval, schedule.index) < timestampDay(at)) schedule.index++;
        }
        schedule.paused = !schedule.paused;
        if (!schedule.paused) materialize(state, at);
        return schedule.paused;
      }
      case 'startInspection':
      case 'result': {
        check(inspection && inspection.status !== 'Completed', 'This inspection is already submitted.');
        check(actor.id === inspection.assigneeId || actor.role === 'Supervisor', 'Switch to the assigned inspector or a supervisor.');
        inspection.status = 'Draft';
        inspection.startedAt ||= at;
        inspection.updatedAt = at;
        if (action.type === 'result') {
          const result = inspection.results[action.questionId];
          check(result, 'Inspection question not found.');
          if (value.value) {
            check(['Pass','Fail'].includes(value.value), 'Choose Pass or Fail.');
            if (result.value !== value.value) {
              result.at = at;
              result.recordedBy = actor.id;
            }
            result.value = value.value;
          }
          updateDraft(result, value);
        }
        return inspection.id;
      }
      case 'submit': {
        check(inspection && inspection.status !== 'Completed', 'This inspection is already submitted.');
        check(actor.id === inspection.assigneeId || actor.role === 'Supervisor', 'Switch to the assigned inspector or a supervisor.');
        for (const question of inspection.questions) {
          const result = inspection.results[question.id];
          check(result.value, 'Choose Pass or Fail for every check.');
          check(result.value !== 'Fail' || result.notes.trim(), 'Add finding notes for each failed check.');
        }
        inspection.status = 'Completed';
        inspection.submittedAt = inspection.updatedAt = at;
        inspection.submittedBy = actor.id;
        return inspection.questions.filter(q => inspection.results[q.id].value === 'Fail').map(q =>
          addWork(state, {
            title: 'Correct: ' + q.label, description: inspection.results[q.id].notes, assetId: inspection.assetId,
            assigneeId: state.settings.defaultAssignee, priority: q.priority,
            due: shift(timestampDay(at), state.settings.correctiveDays)
          }, at, actor, {inspectionId: inspection.id, questionId: q.id}).id);
      }
      case 'work': return addWork(state, value, at, actor).id;
      case 'assign': {
        check(work && open(work), 'Closed work orders cannot be edited.');
        check(!value.assigneeId || find(state.people, value.assigneeId), 'Select a valid assignee.');
        check(priorities.includes(value.priority), 'Choose a priority.');
        const due = dateValue(value.due);
        const notes = [];
        if (work.assigneeId !== value.assigneeId) notes.push('Assignee: ' + (find(state.people, value.assigneeId)?.name || 'Unassigned'));
        if (work.priority !== value.priority) notes.push('Priority: ' + value.priority);
        if (work.due !== due) notes.push('Due: ' + due);
        Object.assign(work, {due, priority: value.priority, assigneeId: value.assigneeId});
        if (notes.length) {
          history(work, at, actor, 'Assignment updated', notes.join(' · '));
          work.history.at(-1).due = due;
        }
        return work.id;
      }
      case 'startWork':
        check(work?.status === 'Open', 'Only open work orders can be started.');
        check(work.assigneeId, 'Assign this work order before starting.');
        check(actor.id === work.assigneeId || actor.role === 'Supervisor', 'Switch to the assigned profile or a supervisor.');
        history(work, at, actor, 'Work started', '', 'In Progress');
        return;
      case 'repairDraft':
      case 'requestReview':
        check(work?.status === 'In Progress', 'Start the work order before adding repair evidence.');
        check(actor.id === work.assigneeId || actor.role === 'Supervisor', 'Switch to the assigned profile or a supervisor.');
        if (action.type === 'repairDraft') { updateDraft(work.draft, value); return; }
        check(work.assigneeId, 'Assign this work order before submitting a repair.');
        check(work.draft.notes.trim(), 'Describe the repair before requesting verification.');
        work.repairs.push({...work.draft, at, actorId: actor.id});
        work.draft = {notes: '', photos: []};
        history(work, at, actor, 'Repair submitted for verification', '', 'Pending Verification');
        return;
      case 'reject':
      case 'close':
        supervisor();
        check(work?.status === 'Pending Verification', 'Only repairs pending verification can be reviewed.');
        if (action.type === 'reject') history(work, at, actor, 'Repair returned for rework', required(value.notes, 'Rework reason'), 'In Progress');
        else {
          work.closedAt = at;
          history(work, at, actor, 'Repair verified and closed', String(value.notes ?? '').trim(), 'Closed');
        }
        return;
      default: throw new Error('This operation is unavailable.');
    }
  }
  function stats(state, siteId, days, today = localDay(), offset = 0) {
    const end = shift(today, -offset);
    const start = shift(end, 1 - days);
    const inRange = day => day >= start && day <= end;
    const belongs = record => !siteId || assetSite(state, record.assetId) === siteId;
    const inspections = state.inspections.filter(record => belongs(record) && inRange(record.due));
    const completed = inspections.filter(record => record.submittedAt && timestampDay(record.submittedAt) <= end).length;
    const allWork = state.work.filter(belongs);
    const work = allWork.map(record => ({record, status: statusAt(record, end)})).filter(item => item.status);
    const outstanding = work.filter(item => item.status !== 'Closed').map(item => item.record);
    const overdue = outstanding.filter(record => {
      const due = record.history.filter(entry => entry.due && timestampDay(entry.at) <= end).at(-1)?.due || record.due;
      return due < end;
    });
    const closed = work.filter(item => item.status === 'Closed' && inRange(timestampDay(item.record.closedAt)));
    const distribution = statuses.map(status => status === 'Closed' ? closed.length : work.filter(item => item.status === status).length);
    const groups = Array.from({length: 6}, (_, index) => {
      const from = shift(start, Math.floor(index * days / 6));
      const to = shift(start, Math.floor((index + 1) * days / 6) - 1);
      const within = iso => iso && timestampDay(iso) >= from && timestampDay(iso) <= to;
      return {start: from, end: to, opened: allWork.filter(record => within(record.createdAt)).length, closed: allWork.filter(record => within(record.closedAt)).length};
    });
    return {start, end, inspections, completed, rate: inspections.length ? Math.round(completed / inspections.length * 100) : null,
      outstanding, overdue, resolved: closed.length, distribution, groups};
  }

    timestampDay, validDate, chain, location, assetSite, event, open, isOverdue, empty, perform, stats, occurrence, makeInspection, addWork, statusAt}});
})();

      for (const token of paragraph.split(/\s+/).filter(Boolean)) {
        if (line && estimate(line+' '+token,size)>available) { lines.push(line); line=''; }
        if (estimate(token,size)>available) {
          for (const char of token) {
            if (estimate(line+char,size)>available) { lines.push(line); line=''; }
            line+=char;
          }

      lines.push(line);

    const bold = put('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

    if (action === 'asset') {
      const current=find(state.assets,id);
      if (!areaChoices().length) return requireSetup('Add asset',`<p class="inline-info">Add a site, a building, and an inspection area first.</p>${btn('Add location','place',{symbol:'plus',style:'primary'})}`);
      show(current?'Edit equipment':'Add equipment',field('name','Equipment name',current?.name,{required:true,wide:true})+
        field('tag','Asset tag',current?.tag,{required:true})+field('type','Equipment type',current?.type,{required:true})+
        pick('areaId','Inspection area',[['','Select an area'],...areaChoices()],current?.areaId||parent,{required:true,wide:true})+
        pick('status','Operational status',assetStates,current?.status||'In service')+field('manufacturer','Manufacturer',current?.manufacturer)+
        field('model','Model',current?.model)+field('serial','Serial number',current?.serial)+
        field('notes','Notes',current?.notes,{type:'textarea',max:2000,wide:true}),{form:'asset',id});
    }
    if (action === 'person') {
      const current=find(state.people,id);
      show(current?'Edit local profile':'Add local profile',field('name','Full name',current?.name,{required:true,wide:true})+
        pick('role','Role',roles,current?.role||'Inspector',{wide:true}),{form:'person',id});
    }
    if (action === 'new-work') {
      if (!state.assets.length) return requireSetup('New work order',`<p class="inline-info">Add equipment in ${FP.UI.link('Sites & Assets','assets')} before creating a work order.</p>`);
      show('New work order',field('title','Title','',{required:true,wide:true})+selectAsset(assetId,true)+
        selectPerson('Assignee',state.settings.defaultAssignee,true,'Maintenance')+pick('priority','Priority',priorities,'Medium')+
        field('due','Due date',shift(today,state.settings.correctiveDays),{type:'date',required:true})+
        field('description','Description','',{type:'textarea',wide:true,max:4000}),{form:'work',submit:'Create work order'});
    }
    if (action === 'assign') {
      const order=find(state.work,id);
      show('Edit assignment',selectPerson('Assignee',order.assigneeId,true,'Maintenance')+
        pick('priority','Priority',priorities,order.priority)+field('due','Due date',order.due,{type:'date',required:true}),{form:'assign',id});
    }
    if (action === 'review') {
      const label = value==='close'?'Verify and close':'Return for rework';
      show(label,field('notes',value==='close'?'Verification notes (optional)':'Rework reason','',{type:'textarea',required:value==='reject',wide:true,max:4000}),
        {form:value,id,submit:label,danger:value==='reject'});
    }
  }
  const forms = new Set(['new-inspection','reschedule','recurrence','template','place','asset','person','new-work','assign','review']);
  async function saveForm(form) {
    const type=form.dataset.form;
    const id=form.dataset.id;
    const fields=Object.fromEntries(new FormData(form));
    if (type==='template') {
      fields.questions=[...form.querySelectorAll('[data-question-row]')].map(row=>({
        id:row.dataset.qid,label:row.querySelector('[name=question]').value,
        criteria:row.querySelector('[name=criteria]').value,priority:row.querySelector('[name=priority]').value
      }));
    }
    if (type==='recurrence') fields.paused=find(state.schedules,id)?.paused ?? false;
    if (type==='profile') {
      await commit({type,id:fields.profile});
      closeDialog();
      render();
      return notify('Switched to '+person(state,state.activeId)+'.');
    }
    if (type==='reset') {
      state=await storage.restore(FP.empty(),[],state.revision);
      imageCache.clear();
      closeDialog();
      go('settings');
      return notify('Blank workspace created.');
    }
    if (type==='confirmed-restore') {
      state=await storage.restore(modal.backup.state,modal.backup.images,modal.revision);
      imageCache.clear();
      await commit({type:'tick'});
      closeDialog();
      go('dashboard');
      return notify('Backup restored with its photos and history.');
    }
    const result=await commit({type,id,fields});
    closeDialog();
    const redirects={inspection:'inspections/run/',work:'work/',asset:'assets/item/',place:'assets/place/'};
    if (redirects[type]) go(redirects[type]+result);
    else render();
    notify(type==='reject'?'Repair returned for rework.':type==='close'?'Repair verified and work order closed.':'Changes saved.');
  }
  async function action(name,data,control) {
    const {id,question,kind,value}=data;
    if (name==='cancel') return closeDialog();
    if (name==='menu') {
      const visible=app.classList.toggle('nav-open');
      app.querySelector('.mobile-menu')?.setAttribute('aria-expanded',String(visible));
      if (visible) app.querySelector('.sidebar nav a')?.focus();
      else app.querySelector('.mobile-menu')?.focus();
      return;
    }
    if (name==='add-question'||name==='remove-question') {
      const group=content.querySelector('#template-questions');
      if (name==='add-question' && group.children.length<40) {
        group.insertAdjacentHTML('beforeend',templateQuestion({},group.children.length));
        group.lastElementChild.querySelector('input').focus();
      }
      if (name==='remove-question' && group.children.length>1) control.closest('fieldset').remove();
      [...group.children].forEach((row,index)=>row.querySelector('legend').textContent='Check '+(index+1));
      return;
    }
    await flush();
    if (forms.has(name)) return formFor(name,data);
    switch(name) {
      case 'profile':
        return show('Switch local profile',pick('profile','Acting as',state.people.map(p=>[p.id,p.name+' · '+p.role]),state.activeId,{wide:true})+
          '<p class="hint wide">Profiles identify activity on this device.</p>',{form:'profile',submit:'Switch profile'});
      case 'answer':
        await commit(draftAction({id,question,kind},{value}));
        render();
        return;
      case 'photo': {
        const photo=await photograph(id);
        if (photo) show(photo.name,`<img class="large-photo" src="${esc(photo.src)}" alt="${esc(photo.name)}"><p class="hint">Attached ${FP.UI.stamp(photo.at)}</p>`);
        return;
      }
      case 'remove-photo':
        await commit(draftAction({id,question,kind},{removePhoto:data.photoId}));
        render();
        return notify('Photo removed from draft.');
      case 'save-draft':
        await commit({type:'startInspection',id});
        render();
        return notify('Inspection draft saved on this device.');
      case 'submit': {
        const record=find(state.inspections,id);
        const invalid=record.questions.find(q=>!record.results[q.id].value||(record.results[q.id].value==='Fail'&&!record.results[q.id].notes.trim()));
        if (invalid) {
          const fields=[...app.querySelectorAll('[data-question]')];
          fields.find(el=>el.dataset.question===invalid.id && (record.results[invalid.id].value?el.matches('textarea'):el.matches('button')))?.focus();
          throw new Error(record.results[invalid.id].value ? 'Add finding notes for the failed check.' : 'Choose Pass or Fail for every check.');
        }
        const work=await commit({type:'submit',id});
        render();
        return notify(work.length ? 'Inspection submitted. '+work.length+' corrective work order'+(work.length===1?'':'s')+' created.' : 'Inspection submitted.');
      }
      case 'pause': {
        const paused=await commit({type:'pause',id});
        render();
        return notify(paused?'Recurring schedule paused.':'Recurring schedule resumed.');
      }
      case 'start-work':
        await commit({type:'startWork',id});
        render();
        return notify('Work order started.');
      case 'request-review':
        await commit({type:'requestReview',id});
        render();
        return notify('Repair is ready for supervisor verification.');
      case 'pdf': {
        const blob=await FP.pdf(state,kind,id,photograph);
        download('FieldProof-'+id+'.pdf',blob);
        return notify('PDF report downloaded.');
      }
      case 'backup': {
        const backup=await storage.backup();
        const blob=new Blob([JSON.stringify(backup)],{type:'application/json'});
        download('FieldProof-backup-'+localDay()+'.json',blob);
        return notify('Backup downloaded.');
      }
      case 'restore':
        show('Restore a backup','<p>Choose a FieldProof backup. Review its contents before replacing this workspace.</p><label class="field">Backup file<input id="backup-file" type="file" accept=".json,application/json"></label>');
        return;
      case 'reset':
        return show('Start a blank workspace','<p class="inline-info wide">This replaces all records and photographs in this browser. Export a backup first if you need them.</p>',
          {form:'reset',submit:'Replace workspace',danger:true});
      case 'persist': {
        const saved=await navigator.storage?.persist?.();
        return notify(saved?'The browser granted persistent storage.':'The browser has not granted persistent storage. Keep a separate backup.',saved?'success':'info');
      }
    }
  }
  async function guarded(handler,control) {
    if (busy) return;
    busy=true;
    if (control?.tagName==='BUTTON') control.disabled=true;
    try { await handler(); }
    catch (error) {
      const inline=dialog.open&&dialog.querySelector('.form-error');
      if (inline) { inline.hidden=false; inline.textContent=error.message; }
      else fail(error);
    } finally { busy=false; if (control?.tagName==='BUTTON') control.disabled=false; }
  }
  document.addEventListener('click',event=>{
    if (event.target.closest('.skip')) {
      event.preventDefault();
      document.querySelector('#main')?.focus();
      return;
    }
    const node=event.target.closest('[data-action]');
    if (node && state) {
      const data={...node.dataset};
      guarded(()=>action(data.action,data,node),node);
    }
    const anchor=event.target.closest('a[href^="#"]');
    if (anchor) {
      if (dialog.open) closeDialog();
      app.classList.remove('nav-open');
      app.querySelector('.mobile-menu')?.setAttribute('aria-expanded','false');
    }
  });
  document.addEventListener('submit',event=>{
    const form=event.target.closest('[data-form]');
    if (!form) return;
    event.preventDefault();
    guarded(async()=>{ await flush(); await saveForm(form); },event.submitter);
  });
  document.addEventListener('input',event=>{
    const {dataset,value}=event.target;
    if (dataset.search) { filters[dataset.search]=value; render(dataset.search); }
    if ('draft' in dataset) {
      pending.set(key(dataset),{...dataset,notes:value,actorId:state.activeId,workspaceKey:state.workspaceKey});
      const label=document.querySelector('#draft-state');
      if (label) label.textContent='Saving draft…';
      clearTimeout(noteTimer);
      noteTimer=setTimeout(()=>flush().catch(fail),320);
    }
  });
  document.addEventListener('change',event=>{
    const {dataset,value,files}=event.target;
    if (dataset.filter) { filters[dataset.filter]=value; render(); app.querySelector('[data-filter="'+dataset.filter+'"]')?.focus(); }
    if ('photoInput' in dataset && files?.length) {
      const selection=Array.from(files);
      event.target.value='';
      guarded(async()=>{
        await flush();
        let saved=0;
        const errors=[];
        for (const file of selection) {
          try {
            const photo=await storage.encodePhoto(file);
            await commit(draftAction(dataset,{photo}));
            saved++;
          } catch(error) { errors.push(error); }
        }
        render();
        if (errors.length) throw new Error((saved?saved+' photo(s) saved. ':'')+errors[0].message);
        notify(saved+' photo'+(saved===1?'':'s')+' saved on this device.');
      });
    }
    if (event.target.id==='backup-file' && files?.length) {
      guarded(async()=>{
        const backup=await storage.readBackup(files[0]);
        const data=backup.state;
        show('Confirm backup restore',`<p class="wide"><strong>${esc(data.workspace)}</strong> contains ${data.assets.length} assets, ${data.inspections.length} inspections, ${data.work.length} work orders, and ${backup.images.length} photos.</p>
          <p class="inline-info wide">Restoring replaces this browser’s current workspace. Export the current workspace first if you need a copy.</p>`,
          {form:'confirmed-restore',submit:'Replace with backup',danger:true});
        modal.backup=backup;
        modal.revision=state.revision;
      });
    }
  });
  window.addEventListener('hashchange',()=>{
    flush().catch(fail).finally(()=>{
      render();
      window.scrollTo(0,0);
      document.querySelector('#main')?.focus({preventScroll:true});
    });
  });
  window.addEventListener('beforeunload',event=>{
    if (pending.size || savingNotes) { event.preventDefault(); event.returnValue=''; }
  });
  window.addEventListener('keydown',event=>{
    if (event.key==='Escape' && app.classList.contains('nav-open')) action('menu',{},null);
  });
  async function sync() {
    if (!state || busy || pending.size || dialog.open) return;
    if (externalRevision>state.revision) {
      const latest=await storage.get();
      if (latest?.revision>state.revision) {
        state=latest;
        imageCache.clear();
        render();
      }
    }
    if (loadedDay!==localDay()) {
      loadedDay=localDay();
      await commit({type:'tick'});
      render();
    }
  }
  storage.channel?.addEventListener('message',event=>{
    externalRevision=Math.max(externalRevision,event.data);
    sync().catch(fail);
  });
  document.addEventListener('visibilitychange',()=>{
    if (document.hidden) flush().catch(fail);
    else sync().catch(fail);
  });
  setInterval(()=>sync().catch(fail),30000);
  async function boot() {
    state=await storage.get();
    if (!state) {
      const demo=FP.demo();
      const images=[];
      if (FP.demoPhoto) {
        const finding=find(demo.state.inspections,demo.photoTarget.inspectionId).results[demo.photoTarget.questionId];
        const photo={...FP.demoPhoto,id:'demo-pump-photo',at:finding.at,name:'Pump seal seepage (demo).jpg'};
        const {src,...meta}=photo;
        images.push(photo);
        demo.state.evidence.push(meta);
        finding.photos.push(meta.id);
      }
      state=await storage.restore(demo.state,images);
    }
    await sync();
    if ('serviceWorker' in navigator && /^https?:$/.test(window.location.protocol)) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  }
  boot().catch(error=>{
    app.innerHTML=`<main class="load-error"><h1>FieldProof could not open this workspace</h1>${empty('Local storage is unavailable',error.message,'warning')}<button class="btn primary" type="button" onclick="window.location.reload()">Try again</button></main>`;
  });
})();

</script>
</body>
</html>
